# Lighthouse ERP V7 Help Centre - screen options   (DEVELOPMENT defaults)
# UAT and PRODUCTION values live in  deploy\env\  and are applied by  scripts\package_release.ps1
# true  = the button is shown          false = the button is hidden
# A missing line means "shown". No restart needed: save this file, then press Ctrl+F5 in the browser.

# Copy a shareable link to the open document
ui.btn.copyLink=false

# Print the open document
ui.btn.print=false

# Download the PDF
ui.btn.download=false

# Save to favourites (star)
ui.btn.save=true

# "Copy page for AI" menu (Copy / Open in ChatGPT / Open in Claude)
ui.btn.copyForAI=true

# PDF | Reader switch
ui.btn.viewSwitch=true

# Previous / Next document arrows
ui.btn.prevNext=true

# PDF viewer: custom = the Help Centre's own light viewer (page numbers, zoom, fit width)
#             native = the browser's built-in viewer
ui.viewer=custom

# Public address of this site (used for the links in the Markdown pages for "Open in ChatGPT / Claude").
# Empty = the address the page was opened on (fine for development).
# If it changes, then run  python tools\build_md.py --force  on the server.
site.url=
