# nginx site for the PUBLIC Help Centre   https://help.lighthouseindia.com/docs/v7/
# Windows: put this server block inside the http { } of C:\nginx\conf\nginx.conf (or include it).
# Linux:   /etc/nginx/conf.d/help.lighthouseindia.com.conf
# Test:    nginx -t        Apply: nginx -s reload
# Tomcat serves the files on 127.0.0.1:8888 (webapps\LHS_ERP_HELP_DOC_V7); only nginx is public.

server {
    listen 80;
    server_name help.lighthouseindia.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name help.lighthouseindia.com;

    # certificate files - adjust the paths (win-acme / certbot / company certificate)
    ssl_certificate     C:/nginx/ssl/fullchain.pem;
    ssl_certificate_key C:/nginx/ssl/privkey.pem;

    add_header X-Content-Type-Options nosniff always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    gzip on;
    gzip_types text/css application/javascript application/json text/plain text/markdown image/svg+xml;

    # the Help Centre lives at /docs/v7/  (the trailing slash matters: the app uses relative links)
    location = /docs/v7 { return 301 /docs/v7/; }
    location = /        { return 302 /docs/v7/; }

    location /docs/v7/ {
        proxy_pass http://127.0.0.1:8888/LHS_ERP_HELP_DOC_V7/;     # /docs/v7/x  ->  Tomcat /LHS_ERP_HELP_DOC_V7/x
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location / { return 404; }                                 # nothing else is published
}
